{% extends "base.html" %}

{% block page_content %}
<h1>Forgot Password</h1>

<form method="POST">
    {{ form.hidden_tag() }}

    <div class="form-group">
        {{ form.email.label }}
        {{ form.email(class="form-control") }}
    </div>

    {{ form.submit(class="btn btn-primary") }}
</form>

<p>
    <a href="{{ url_for('auth.login') }}">Back to Login</a>
</p>
{% endblock %}
